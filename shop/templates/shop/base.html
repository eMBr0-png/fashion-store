{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин одежды{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #111 !important; }
        .product-card { transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .price { font-weight: bold; color: #111; }
        .old-price { text-decoration: line-through; color: #888; font-size: 0.9em; }
        .discount-badge { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">SKYLINCOV GROUP SHOP</a>
            <div class="navbar-nav ms-auto">
    <a class="nav-link" href="/">Все товары</a>
    <a class="nav-link" href="{% url 'shop:cart_detail' %}">
        Корзина
        {% if cart|length > 0 %}
            <span class="badge bg-danger">{{ cart|length }}</span>
        {% endif %}
    </a>
</div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center text-muted py-4 mt-5">
        <small>© 2026 skylincov group Shop — подростковая одежда</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
